# Secret de exemplo, versionado de propósito para que `kubectl apply -f k8s/` funcione em
# qualquer clone sem passo manual. Os valores abaixo são funcionais e descartáveis: o banco
# só escuta dentro do cluster e o papel usado pela API tem privilégio mínimo.
#
# Para um ambiente com dados reais, troque os valores mantendo o nome do objeto
# (`postgres-secret`), que é o que os Deployments referenciam, ou remova este arquivo e crie
# o Secret pelo pipeline de deploy ou por um gestor externo (External Secrets, Vault).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: desafio-k8s
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: postgres
    app.kubernetes.io/part-of: k8s-postgrest-challenge
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  # Senha do usuário dono do banco (bootstrap). Consumida via POSTGRES_PASSWORD_FILE.
  postgres-password: demo_postgres_pw

  # Senha do papel `authenticator`, usado exclusivamente pela API para conectar e
  # trocar de papel. Lida pelo script de init a partir do arquivo montado.
  authenticator-password: demo_authenticator_pw

  # Configuração do PostgREST montada como arquivo (/etc/postgrest/postgrest.conf).
  # A API conecta como `authenticator`, que não tem privilégio nenhum por si só, e
  # assume `web_anon` (SELECT/INSERT apenas em `todos`) para requisições anônimas.
  postgrest.conf: |
    db-uri = "postgres://authenticator:demo_authenticator_pw@postgres:5432/desafio_db"
    db-schemas = "public"
    db-anon-role = "web_anon"
    server-port = 3000
