apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgrest
  namespace: desafio-k8s
  labels:
    app.kubernetes.io/name: postgrest
    app.kubernetes.io/instance: postgrest
    app.kubernetes.io/part-of: k8s-postgrest-challenge
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  selector:
    matchLabels:
      app: postgrest
  template:
    metadata:
      labels:
        app: postgrest
        app.kubernetes.io/name: postgrest
        app.kubernetes.io/instance: postgrest
        app.kubernetes.io/part-of: k8s-postgrest-challenge
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # Faz o volume do Secret ser group-owned por 1000, permitindo leitura com 0440.
        fsGroup: 1000
      containers:
        - name: postgrest
          # Imagem fixada por digest (build reprodutível).
          image: postgrest/postgrest@sha256:ec0e25a4e24b0a3bc5e4f011369bfc736bd1b19f513bd01079b86329a7636962
          imagePullPolicy: Always
          # Configuração vem de arquivo montado a partir do Secret — a string de
          # conexão nunca aparece em variável de ambiente nem em `kubectl describe`.
          command: ["/bin/postgrest"]
          args: ["/etc/postgrest/postgrest.conf"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /todos
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: postgrest-config
              mountPath: /etc/postgrest
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: postgrest-config
          secret:
            secretName: postgres-secret
            defaultMode: 0440
            items:
              - key: postgrest.conf
                path: postgrest.conf
        - name: tmp
          emptyDir: {}
