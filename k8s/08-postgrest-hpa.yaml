apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: postgrest
  namespace: desafio-k8s
  labels:
    app.kubernetes.io/name: postgrest
    app.kubernetes.io/instance: postgrest
    app.kubernetes.io/part-of: k8s-postgrest-challenge
    app.kubernetes.io/managed-by: kubectl
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: postgrest
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 30

