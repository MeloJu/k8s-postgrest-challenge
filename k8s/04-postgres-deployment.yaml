apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: desafio-k8s
  annotations:
    checkov.io/skip1: CKV_K8S_40=uid 999 é o usuário `postgres` da imagem oficial, presente em /etc/passwd; initdb resolve o uid via getpwuid() e falha com um uid arbitrário inexistente no container
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: postgres
    app.kubernetes.io/part-of: k8s-postgrest-challenge
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  strategy:
    # PVC ReadWriteOnce só monta em um Pod por vez: o Pod antigo precisa sair antes
    # do novo entrar, senão o rollout trava em Pending.
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: postgres
        app.kubernetes.io/part-of: k8s-postgrest-challenge
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          # Tag 16.15 fixada por digest (build reprodutível).
          image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # A primeira inicialização roda o initdb e o script de schema; a startupProbe
          # dá essa janela sem afrouxar a liveness em regime normal.
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "desafio_user", "-d", "desafio_db"]
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "desafio_user", "-d", "desafio_db"]
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "desafio_user", "-d", "desafio_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_DB
            - name: PGDATA
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: PGDATA
            # Credencial lida de arquivo, não de variável de ambiente.
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/postgres/postgres-password
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: postgres-secret
              mountPath: /run/secrets/postgres
              readOnly: true
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d/init.sh
              subPath: init.sh
              readOnly: true
            # readOnlyRootFilesystem exige volumes graváveis explícitos para os
            # caminhos que o Postgres usa fora do PGDATA.
            - name: run-postgresql
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: postgres-secret
          secret:
            secretName: postgres-secret
            defaultMode: 0440
            items:
              - key: postgres-password
                path: postgres-password
              - key: authenticator-password
                path: authenticator-password
        - name: postgres-init
          configMap:
            name: postgres-config
            defaultMode: 0555
            items:
              - key: init.sh
                path: init.sh
        - name: run-postgresql
          emptyDir: {}
        - name: tmp
          emptyDir: {}
