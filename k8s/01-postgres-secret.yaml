apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: desafio-k8s
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: postgres
    app.kubernetes.io/part-of: k8s-postgrest-challenge
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  # Senha do usuário dono do banco (bootstrap). Consumida via POSTGRES_PASSWORD_FILE.
  postgres-password: senha123

  # Senha do papel `authenticator`, usado exclusivamente pela API para conectar e
  # trocar de papel. Lida pelo script de init a partir do arquivo montado.
  authenticator-password: senha456

  # Configuração do PostgREST montada como arquivo (/etc/postgrest/postgrest.conf).
  # A API conecta como `authenticator`, que não tem privilégio nenhum por si só, e
  # assume `web_anon` (SELECT/INSERT apenas em `todos`) para requisições anônimas.
  postgrest.conf: |
    db-uri = "postgres://authenticator:senha456@postgres:5432/desafio_db"
    db-schemas = "public"
    db-anon-role = "web_anon"
    server-port = 3000
